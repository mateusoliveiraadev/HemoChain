# Perfil "prod": usado no container (compose.yaml) e no deploy.
# Nenhum segredo aqui: tudo vem de variaveis de ambiente (.env local ou secrets da plataforma).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Console do H2 nao deve existir fora do ambiente de desenvolvimento.
spring.h2.console.enabled=false

# Plataformas como o Render informam a porta em PORT.
server.port=${PORT:8080}
