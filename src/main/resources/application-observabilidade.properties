# Perfil "observabilidade": metricas, traces e logs para Prometheus, Tempo e Loki.
# Ativado somente no Compose de demonstracao.

# Endpoints do Actuator ficam em outra porta, que o compose NAO publica no host:
# acessivel aos servicos da rede Docker de telemetria e aos administradores do Docker.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=HemoChain - gestao da cadeia de hemocomponentes

# Tag application=hemochain em todas as metricas (filtro dos dashboards).
management.metrics.tags.application=${spring.application.name}
# Histograma de latencia HTTP: habilita p95/p99 no Grafana.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Traces via OTLP/HTTP para o Tempo. Amostragem total porque o volume e de laboratorio.
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
jdbc.datasource-proxy.enabled=true
management.observations.key-values.application=${spring.application.name}
management.metrics.distribution.slo.hemochain.entrega.registro=10ms,50ms,100ms,500ms,1s
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

# Registra no log (nivel WARN, com traceId) as respostas 4xx tratadas como excecao.
spring.mvc.log-resolved-exception=true

# Destino dos logs (ver logback-spring.xml).
observabilidade.loki.url=${LOKI_URL:http://loki:3100/loki/api/v1/push}
