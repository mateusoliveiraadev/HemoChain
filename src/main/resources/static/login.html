<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemoChain - Login</title>
    <link rel="icon" href="/assets/branding/favicon.png" type="image/png" sizes="64x64">
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/ManropeVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/login.css">
    <script type="module" src="/js/magnetic.js"></script>
    <script type="module" src="/js/login-ui.js"></script>
</head>
<body class="hemo-login">
<div class="login-liquid" aria-hidden="true"><canvas></canvas></div>
<main class="login-card" aria-labelledby="titulo">
    <div class="login-brand"><img src="/assets/branding/hemochain-wordmark.png" width="1086" height="362" alt="HemoChain"></div>
    <h1 id="titulo">Acesse sua conta</h1>
    <p class="login-intro" id="loginIntro">Seu acesso à gestão de hemocomponentes.</p>
    <form class="login-form" id="loginForm" novalidate>
        <div id="campoNome" class="form-group hidden">
            <label for="inputNome">Nome</label>
            <input type="text" id="inputNome" placeholder="Seu nome completo" autocomplete="name">
        </div>
        <div class="form-group">
            <label for="inputEmail">E-mail</label>
            <input type="email" id="inputEmail" placeholder="seu.email@exemplo.com" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="emailHint">
            <p class="login-hint" id="emailHint" hidden></p>
        </div>
        <div class="form-group">
            <label for="inputSenha">Senha</label>
            <input type="password" id="inputSenha" placeholder="Sua senha" autocomplete="current-password">
        </div>
        <div id="campoPerfil" class="form-group hidden">
            <label for="inputPerfil">Perfil</label>
            <select id="inputPerfil">
                <option value="GESTOR_HEMOCENTRO">Gestor de Hemocentro</option>
                <option value="OPERADOR_LOGISTICA">Operador de Logística</option>
                <option value="HOSPITAL_SOLICITANTE">Hospital Solicitante</option>
            </select>
        </div>
        <div class="login-actions">
            <button id="btnAcao" type="button">ENTRAR</button>
            <button class="login-secondary" id="btnAlternar" type="button" aria-controls="campoNome campoPerfil" aria-expanded="false">Não tenho conta. Cadastrar</button>
        </div>
        <div id="statusMsg" class="status" role="status" aria-live="polite" aria-atomic="true"></div>
    </form>
    <p class="login-footer">Ambiente acadêmico · Dados sintéticos</p>
</main>
<script>
    const api = {
        cadastrar: (dados) => fetch('/usuarios/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        }),
        login: (dados) => fetch('/usuarios/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        })
    };

    let modoLogin = true;
    const statusMsg = document.getElementById('statusMsg');

    async function mensagemDeErro(resposta, mensagemPadrao) {
        try {
            const corpo = await resposta.json();
            return corpo.message || mensagemPadrao;
        } catch (e) {
            return mensagemPadrao;
        }
    }

    window.onload = () => {
        if (localStorage.getItem('hemochainUsuario')) {
            window.location.href = 'index.html';
        }
    };

    document.getElementById('btnAlternar').onclick = () => {
        modoLogin = !modoLogin;
        document.getElementById('titulo').innerText = modoLogin ? 'HemoChain - Entrar' : 'HemoChain - Cadastro';
        document.getElementById('campoNome').classList.toggle('hidden', modoLogin);
        document.getElementById('campoPerfil').classList.toggle('hidden', modoLogin);
        document.getElementById('btnAcao').innerText = modoLogin ? 'ENTRAR' : 'CRIAR CONTA';
        document.getElementById('btnAlternar').innerText = modoLogin ? 'Nao tem conta? Cadastre-se aqui' : 'Ja tem conta? Voltar ao login';
        statusMsg.innerText = '';
    };

    document.getElementById('btnAcao').onclick = async () => {
        const email = document.getElementById('inputEmail').value.trim();
        const senha = document.getElementById('inputSenha').value;
        statusMsg.innerText = 'Processando...';

        try {
            if (modoLogin) {
                const resposta = await api.login({ email, senha });
                if (!resposta.ok) {
                    throw new Error(await mensagemDeErro(resposta, 'E-mail ou senha incorretos.'));
                }
                const usuario = await resposta.json();
                localStorage.setItem('hemochainUsuario', JSON.stringify(usuario));
                window.location.href = 'index.html';
            } else {
                const nome = document.getElementById('inputNome').value.trim();
                const perfil = document.getElementById('inputPerfil').value;
                const resposta = await api.cadastrar({ nome, email, senha, perfil });
                if (!resposta.ok) {
                    throw new Error(await mensagemDeErro(resposta, 'Nao foi possivel cadastrar.'));
                }
                document.getElementById('btnAlternar').click();
                statusMsg.style.color = '#2e7d32';
                statusMsg.innerText = 'Conta criada! Faça login.';
            }
        } catch (erro) {
            statusMsg.style.color = '#e74c3c';
            statusMsg.innerText = erro.message;
        }
    };
</script>
</body>
</html>
