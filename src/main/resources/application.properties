spring.application.name=hemochain

# Banco H2 local, persistido em arquivo (nao e in-memory: dados sobrevivem ao restart)
spring.datasource.url=jdbc:h2:file:./data/hemochain
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.port=8080
server.error.include-message=always
server.error.include-stacktrace=never

# Valores DIDATICOS em dias; nao sao regras clinicas oficiais.
estoque.validade.hemacias=35
estoque.validade.plasma=365
estoque.validade.plaquetas=5
estoque.validade.crioprecipitado=365
estoque.alertas.dias=5,2
# Verifica diariamente a meia-noite, ao iniciar e nas consultas ao estoque.
estoque.verificacao.cron=0 0 0 * * *

# Healthcheck usado pelo Docker/Compose e pela esteira (apenas /actuator/health, sem detalhes).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Prazo ISO-8601 a partir do registro efetivo da entrega (UTC).
recebimento.prazo=${RECEBIMENTO_PRAZO:PT24H}
recebimento.verificacao-ms=${RECEBIMENTO_VERIFICACAO_MS:60000}
