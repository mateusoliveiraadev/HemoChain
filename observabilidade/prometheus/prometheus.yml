global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Porta 8081 = porta de gerenciamento do Actuator, so existe dentro da rede do Docker.
  - job_name: hemochain
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
        labels:
          ambiente: lab

  - job_name: node-exporter
    static_configs:
      - targets: ["docker-vm:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: hemochain-observabilidade
        action: keep

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
