name: CI/CD

# Esteira: build -> testes -> imagem -> deploy.
# - Em push e pull request: roda testes e valida o container (gate do merge).
# - So em push na main (merge de PR): publica a imagem e faz o deploy.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Build e testes (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # verify = compila + roda unitarios, integracao e aceitacao + empacota o JAR.
      # Teste vermelho => job vermelho => merge bloqueado (branch protection).
      - name: mvn verify
        run: mvn -B verify
      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  container:
    name: Container sobe do zero (compose + healthcheck)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe API + PostgreSQL
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 240
      - name: Evidencia (docker compose ps e API respondendo)
        run: |
          docker compose ps
          curl -fsS http://localhost:8080/actuator/health
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v

  publish:
    name: Publica imagem no GHCR
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem (minusculo)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no Render
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Dispara o deploy da imagem desta versao
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "Secret RENDER_DEPLOY_HOOK_URL nao configurado"; exit 1; }
          ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['IMAGE'], safe=''))")
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${ENC}"
      - name: Espera a URL publica ficar saudavel
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL" || { echo "Variavel APP_URL nao configurada"; exit 1; }
          for i in $(seq 1 40); do
            if curl -fsS "${APP_URL%/}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Deploy saudavel: ${APP_URL}"; exit 0
            fi
            echo "Tentativa $i/40: aguardando..."; sleep 15
          done
          echo "Deploy nao ficou saudavel. Faca rollback (workflow Rollback)."; exit 1
